# OpenTelemetry Collector — reference config (ADR-058 Phase A).
#
# The single aggregation point for all Amendia OTLP: every service (via amendia_telemetry) and the
# OpenShell/NeMoClaw sandboxes point here. Traces + logs are exported to ClickHouse, the single
# telemetry backend + audit system-of-record. NO Prometheus / Grafana / Loki.
#
# The clickhouse exporter (otelcol-contrib) creates its standard schema on startup
# (create_schema: true) → tables `otel.otel_traces` and `otel.otel_logs`. Metrics are derived by SQL
# over these tables (Phase D), so no metrics pipeline is configured.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    database: otel
    # Auto-create the `otel` database + the standard otel_traces / otel_logs tables on startup.
    create_schema: true
    # Operational traces/logs: short retention (audit_events, a separate table with multi-year TTL,
    # is owned by glea-service in Phase B — trace volume never forces short audit retention).
    ttl: 72h
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
  telemetry:
    logs:
      level: info
