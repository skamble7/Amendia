<rect class="cont" x="30" y="752" width="1180" height="60" rx="10" stroke-width="1"/>
<text class="contlabel" x="44" y="772">Docker network</text>
<text class="note" x="160" y="778">All three compose files share one bridge network. The stub composes join it as external:  amendia → ${AMENDIA_NETWORK:-deploy_default}.</text>
<text class="note" x="160" y="796">Services address each other by container name on the CONTAINER port — e.g. http://agent-runtime:8083 — never via a host port.</text>
