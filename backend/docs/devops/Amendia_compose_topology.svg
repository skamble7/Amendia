<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img">
<title>Amendia local deployment topology (docker compose)</title>
<desc>Every container in the local stack, which compose file owns it, its host-to-container port mapping and whether its data persists. Three compose files share one Docker network: the main backend stack, the MCP capability tool servers, and the mock Pega orchestrator. RabbitMQ has no named volume, so its durable queues do not survive a container recreate.</desc>
