.amber rect { fill: #7A4E00; stroke: #F2C078; }
.amber .tt { fill: #FBE2BB; } .amber .st, .amber .mono { fill: #F2C078; }
.red rect { fill: #8C1D18; stroke: #F2B8B5; }
.red .tt { fill: #F9DEDC; } .red .st, .red .mono { fill: #F2B8B5; }
