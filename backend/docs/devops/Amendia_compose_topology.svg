<text class="h1" x="30" y="38">Amendia — local deployment topology (docker compose)</text>
<text class="h2" x="30" y="58">Read-verified against the working tree 2026-08-19. Host ports are compose defaults and are remappable; container ports are the stable service-to-service contract.</text>
