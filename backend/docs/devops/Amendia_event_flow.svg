<text class="arrlabel" x="674" y="750">agent_runtime.egress_decision.v1</text>
<text class="arrlabel" x="674" y="765">agent_runtime.artifact_committed.v1</text>
<text class="arrlabel" x="674" y="780">identity.role_changed.v1</text>
<text class="arrlabel" x="674" y="795">process_registry.pack_lifecycle.v1</text>
<text class="arrlabel" x="674" y="810">config_forge.config_ref_resolved.v1</text>
<text class="contlabel" x="980" y="730" font-size="11.5">Cohorts (own tables)</text>
<text class="arrlabel" x="980" y="750">agent_runtime.cohort_lifecycle.v1</text>
<text class="arrlabel" x="980" y="765">agent_runtime.cohort_sla.v1</text>
<text class="note" x="980" y="780"></text>
<text class="note" x="980" y="795">In-sandbox (nemoclaw profile):</text>
<text class="arrlabel" x="980" y="810">agent_runtime.capability_exec_request.v1</text>
<text class="arrlabel" x="980" y="825">agent_runtime.capability_exec_result.v1</text>
<text class="note" x="30" y="900">Queues:  ingestor.trigger_raised.v1  ·  ingestor.dispatch_replies.v1  ·  agent-runtime.trigger_dispatched.v1  ·  glea (durable, named)  ·  notification (broadcast, auto-delete)</text>
<text class="warn" x="30" y="920">No dead-letter exchange, no queue TTL and no message-field encryption anywhere — every declare_queue() passes only durable=True.</text>
<text class="warn" x="30" y="938">RabbitMQ has no named volume in compose, so these durable queues — including the GLEA audit queue — are lost on container recreate.</text>
</svg>
