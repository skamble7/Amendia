<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="956" viewBox="0 0 1320 956" role="img">
<title>Amendia event and data flow</title>
<desc>All asynchronous traffic rides one durable topic exchange, amendia.events, with routing keys of the form service.event.v1. The stub trigger source, ingestor, agent-runtime, process-registry, identity and config-forge publish to it; glea-service consumes governed events into ClickHouse over a durable named queue, and notification-service consumes lifecycle events onto a broadcast queue and relays thin invalidation signals to browsers over SSE. Synchronous HTTP calls, MCP tool calls and third-party LLM inference do not touch the bus.</desc>
