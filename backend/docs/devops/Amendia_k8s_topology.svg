<text class="note" x="1005" y="676">Release name is amendia — cross-service</text>
<text class="note" x="1005" y="692">DNS defaults assume it.</text>
<text class="note" x="1005" y="718">Per-provider overlays set only:</text>
<text class="note" x="1005" y="734">global.storageClass · GPU nodeSelector +</text>
<text class="note" x="1005" y="750">tolerations · ingress.className · SA</text>
<text class="note" x="1005" y="766">identity annotations.</text>
<text class="note" x="1005" y="786">Fail-closed: executionMode=nemoclaw.</text>
<text class="note" x="30" y="828">Open items (ADR-022 revision, chart 0.2.0)</text>
<text class="warn" x="30" y="850">⚠  The PVC-backed datastore Deployments still use the default RollingUpdate strategy. At replicas 1, maxSurge=1 / maxUnavailable=0 schedules the replacement pod</text>
<text class="warn" x="30" y="866">    before the old one releases the ReadWriteOnce volume, so the rollout deadlocks on a single-attach CSI driver. Set strategy: Recreate, or use StatefulSets.</text>
<text class="warn" x="30" y="886">⚠  ClickHouse is single-replica with the passwordless 'default' user and inherits defaults.resources (cpu 1 / mem 512Mi). GLEA_CLICKHOUSE_PASSWORD is not wired to Vault.</text>
<text class="note" x="30" y="906">•  openshell.sandbox.enabled=false — NemoClaw's K8s sandbox mechanism is unconfirmed (# [confirm] + STOP). The baseline hardened worker Deployment is the supported posture.</text>
<text class="note" x="30" y="924">•  The NIM image/args/licensing line is likewise # [confirm] against NVIDIA's official Helm packaging.</text>
<text class="note" x="30" y="942">•  Everything shown is a helm template / helm lint result across defaults + all four overlays. No runtime behaviour has been verified — there is no cluster.</text>
