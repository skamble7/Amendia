<text class="contsub" x="64" y="690">networkPolicy.enabled · defaultDenyEgress · allowDNS (kube-dns required for Service resolution)</text>
<text class="note" x="70" y="706">agent-runtime → mongodb, rabbitmq, process-registry, config-forge, identity, otel     |     ingestor → the same + stub-trigger-generator</text>
<text class="note" x="70" y="724">glea-service → rabbitmq, clickhouse, otel     |     otel-collector → clickhouse     |     webui → the seven services it proxies</text>
<text class="note" x="70" y="742">capability-worker → rabbitmq, config-forge, inference, mcp, otel     |     identity → mongodb, keycloak     |     process-registry → mongodb, identity</text>
<text class="warn" x="70" y="762">Governs EGRESS only. Nothing here restricts who may call a service — see the trust-boundary diagram.</text>
