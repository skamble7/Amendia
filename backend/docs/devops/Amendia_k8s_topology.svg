<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1000" viewBox="0 0 1340 1000" role="img">
<title>Amendia production topology on Kubernetes (Helm chart 0.2.0)</title>
<desc>What the portable umbrella chart renders: one Deployment, Service, ServiceAccount, PodDisruptionBudget, SecretProviderClass and egress NetworkPolicy per service entry, plus optional in-cluster datastores with PersistentVolumeClaims, an OTLP collector exporting to ClickHouse, and a conditional NIM inference workload. Secrets come from Vault over Kubernetes auth. Egress is default-deny with per-workload allowlists. Keycloak and Vault are external in production.</desc>
