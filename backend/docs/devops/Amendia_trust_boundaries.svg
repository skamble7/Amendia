@media (prefers-color-scheme: dark) {
.h1 { fill: #EDEBE3; } .h2 { fill: #B4B2A9; }
.purple rect { fill: #3C3489; stroke: #AFA9EC; }
.purple .tt { fill: #CECBF6; } .purple .st, .purple .mono { fill: #AFA9EC; }
.teal rect { fill: #085041; stroke: #5DCAA5; }
.teal .tt { fill: #9FE1CB; } .teal .st, .teal .mono { fill: #5DCAA5; }
.gray rect { fill: #444441; stroke: #B4B2A9; }
.gray .tt { fill: #D3D1C7; } .gray .st, .gray .mono { fill: #B4B2A9; }
.amber rect { fill: #7A4E00; stroke: #F2C078; }
.amber .tt { fill: #FBE2BB; } .amber .st, .amber .mono { fill: #F2C078; }
.red rect { fill: #8C1D18; stroke: #F2B8B5; }
.red .tt { fill: #F9DEDC; } .red .st, .red .mono { fill: #F2B8B5; }
.cont { stroke: #9C9A92; }
.contlabel { fill: #D3D1C7; } .contsub { fill: #9C9A92; }
