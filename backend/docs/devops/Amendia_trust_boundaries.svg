.purple .tt { fill: #3C3489; } .purple .st, .purple .mono { fill: #534AB7; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.teal .tt { fill: #085041; } .teal .st, .teal .mono { fill: #0F6E56; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
.gray .tt { fill: #444441; } .gray .st, .gray .mono { fill: #5F5E5A; }
.amber rect { fill: #FDF0DC; stroke: #A66A00; }
.amber .tt { fill: #7A4E00; } .amber .st, .amber .mono { fill: #A66A00; }
.red rect { fill: #FDECEC; stroke: #B3261E; }
.red .tt { fill: #8C1D18; } .red .st, .red .mono { fill: #B3261E; }
.cont { fill: none; stroke: #888780; }
.contlabel { font-size: 13px; font-weight: 500; fill: #444441; }
