<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1010" viewBox="0 0 1340 1010" role="img">
<title>Amendia trust and exposure boundaries</title>
<desc>Which services enforce authentication and which do not. Seven services require an OIDC bearer on every endpoint except health. The webui and Keycloak are public by design. The stub trigger generator, the MCP tool servers and the Pega stub are unauthenticated dev scaffolding. glea-service is an unauthenticated production service exposing the whole audit trail, recorded as cleanup-backlog item CB-9. Service to service calls use one static shared token, and outbound egress is enforced for MCP but audit-only for LLM inference.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.h1 { font-size: 19px; font-weight: 600; fill: #1A1A1A; }
.h2 { font-size: 12.5px; font-weight: 400; fill: #5F5E5A; }
.tt { font-size: 13.5px; font-weight: 500; }
.st { font-size: 11px; font-weight: 400; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
