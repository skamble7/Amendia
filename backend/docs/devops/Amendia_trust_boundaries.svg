.legend { font-size: 11px; fill: #5F5E5A; }
.note { font-size: 11px; fill: #5F5E5A; }
.warn { font-size: 11px; fill: #B3261E; font-weight: 500; }
.arr { stroke: #73726C; fill: none; }
.arrlabel { font-size: 10px; fill: #5F5E5A; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
