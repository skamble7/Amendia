[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "config-forge-service"
version = "0.1.0"
description = "ConfigForge — Platform Config Registry Service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "motor>=3.5",
  "python-dotenv>=1.0",
  "orjson>=3.10",
  "dnspython>=2.6",
  # ADR-058 fast-follow: publish ConfigRefResolvedEvent on config-ref resolution.
  "aio-pika>=9.4",
  "amendia-common",
  "amendia-contracts",
  # OTel bootstrap (ADR-058) — the first amendia_* lib this otherwise-standalone service consumed.
  "amendia-telemetry",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "anyio>=4.4",
]

# Editable path sources for the amendia_* libs (config-forge is one dir deeper: platform/*).
[tool.uv.sources]
amendia-common = { path = "../../../../libs", editable = true }
amendia-contracts = { path = "../../../../libs/amendia_contracts", editable = true }
amendia-telemetry = { path = "../../../../libs/amendia_telemetry", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["app", "../../../../libs", "../../../../libs/amendia_contracts", "../../../../libs/amendia_telemetry"]
addopts = "-q"
asyncio_mode = "auto"
