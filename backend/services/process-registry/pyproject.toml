[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "process-registry"
version = "0.1.0"
description = "Amendia process-registry — contract storage, onboarding validation, activation & triage resolve"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "motor>=3.5",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jsonschema>=4.21",
  "packaging>=24.0",
  "orjson>=3.10",
  "dnspython>=2.6",
  # MCP client for onboarding introspection (lazy-imported; fake injected in tests).
  # Cap below mcp 1.29 / 2.0: those releases renamed the client model fields camelCase→snake_case
  # (Tool.outputSchema→output_schema, CallToolResult.structuredContent→structured_content) and removed
  # streamablehttp_client + the low-level Server.list_tools decorator — breaking introspection reads and the
  # MCP stub servers. Pin to the 1.28.x line the MCP servers already run and uv.lock is tested against.
  "mcp>=1.9,<1.29",
  # ADR-052 Phase 2 copilot LLM stack (same as agent-runtime; ADR-016/017/018). langchain backends +
  # the remote ConfigForge loader. Lazy-imported behind the copilot's client seam; a fake is injected in tests.
  "polyllm[langchain,remote]",
  "amendia-common",
  "amendia-contracts",
  "amendia-bpmn",
  "amendia-auth",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "anyio>=4.4",
  "mongomock-motor>=0.0.29",
]

[tool.uv.sources]
amendia-common = { path = "../../../libs", editable = true }
amendia-contracts = { path = "../../../libs/amendia_contracts", editable = true }
amendia-bpmn = { path = "../../../libs/amendia_bpmn", editable = true }
amendia-auth = { path = "../../../libs/amendia_auth", editable = true }
polyllm = { path = "../../../libs/polyllm", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["app", "../../../libs", "../../../libs/amendia_contracts", "../../../libs/amendia_bpmn", "../../../libs/amendia_auth"]
asyncio_mode = "auto"
addopts = "-q"
