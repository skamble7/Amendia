{{- /* Minimal in-cluster OTLP collector (ADR-022 Part G). agent-runtime + worker export traces
       here; the otlp_trace_id → actor_log linkage (ADR-017/020) joins traces to the Mongo audit
       trail by process_instance_id + correlation_id. The export backend (Tempo/Jaeger/Cloud Trace)
       is # per-deployment — configure the collector's exporters. */ -}}
{{- if and .Values.otel.enabled .Values.otel.deployCollector }}
{{- $root := . }}
{{- $fullname := include "amendia.svc" (dict "root" $root "name" "otel-collector") }}
{{- $exporter := .Values.otel.exporter | default "clickhouse" }}
{{- $chSvc := include "amendia.svc" (dict "root" $root "name" "clickhouse") }}
{{- $chEndpoint := .Values.otel.clickhouse.endpoint | default (printf "tcp://%s:9000?dial_timeout=10s&compress=lz4" $chSvc) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-config
  labels:
{{ include "amendia.labels" (dict "root" $root "name" "otel-collector") | indent 4 }}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http: { endpoint: 0.0.0.0:4318 }
          grpc: { endpoint: 0.0.0.0:4317 }
    processors:
      batch: {}
    exporters:
      {{- if eq $exporter "clickhouse" }}
      # ADR-058 telemetry backend (needs the -contrib collector image). Auto-creates the `otel`
      # database + otel_traces/otel_logs on startup; GLEA reads these tables.
      clickhouse:
        endpoint: {{ $chEndpoint | quote }}
        database: {{ .Values.otel.clickhouse.database | quote }}
        create_schema: true
        ttl: {{ .Values.otel.clickhouse.ttl | quote }}
        traces_table_name: otel_traces
        logs_table_name: otel_logs
        timeout: 10s
        retry_on_failure: { enabled: true, initial_interval: 5s, max_interval: 30s }
      {{- else if eq $exporter "otlp" }}
      # per-deployment: forward to a downstream OTLP backend (Tempo/Jaeger/Cloud Trace collector).
      otlp:
        endpoint: {{ .Values.otel.exporterEndpoint | quote }}
        tls: { insecure: true }         # per-deployment: enable TLS to the downstream backend
      {{- end }}
      # Available (stdout) but NOT wired into a pipeline — set otel.exporter to switch backends.
      debug: { verbosity: basic }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [batch], exporters: [{{ $exporter }}] }
        logs:   { receivers: [otlp], processors: [batch], exporters: [{{ $exporter }}] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
{{ include "amendia.labels" (dict "root" $root "name" "otel-collector") | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "amendia.selectorLabels" (dict "root" $root "name" "otel-collector") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "amendia.selectorLabels" (dict "root" $root "name" "otel-collector") | indent 8 }}
    spec:
      containers:
        - name: otel-collector
          image: {{ $root.Values.otel.collectorImage | quote }}
          args: ["--config=/etc/otel/collector.yaml"]
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap: { name: {{ $fullname }}-config }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
{{ include "amendia.labels" (dict "root" $root "name" "otel-collector") | indent 4 }}
spec:
  selector:
{{ include "amendia.selectorLabels" (dict "root" $root "name" "otel-collector") | indent 4 }}
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
{{- end }}
