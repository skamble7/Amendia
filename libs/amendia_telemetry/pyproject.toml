[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amendia-telemetry"
version = "0.1.0"
description = "Amendia OpenTelemetry bootstrap + domain-neutral conventions + instance-trace helpers (ADR-058)"
requires-python = ">=3.11"
dependencies = [
  # OTel SDK + OTLP/HTTP exporter. FastAPI auto-instrumentation for the shallow (web-only) bootstrap.
  # Pinned to the stable 1.x line; the exporter/instrumentation packages track the SDK version.
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[tool.hatch.build.targets.wheel]
packages = ["amendia_telemetry"]
