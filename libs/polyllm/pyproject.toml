[project]
name = "polyllm"
version = "0.1.11"
description = "Config-driven provider-agnostic LLM client (LangChain-backed)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Platform Team" }]

dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
langchain = [
  # V-3 (CVE-2026-45134): 0.3.30 is inside the <0.4 cap. Caps kept deliberately — 1.x fixes for
  # langchain-openai/-anthropic/-text-splitters are ABOVE these caps (Sandeep's call; see report).
  "langchain>=0.3.30,<0.4",
  # V-2 (CVE-2026-44843 / -40087): shared floor so process-registry (which pulls langchain-core only
  # via this extra) tracks agent-runtime at >=0.3.85 instead of drifting 10 patches behind.
  "langchain-core>=0.3.85",
  "langchain-openai>=0.1,<0.3",
  "langchain-anthropic>=0.1,<0.3",
  "langchain-google-genai>=2.0",
  "langchain-aws>=0.1,<0.3",
]

yaml = ["pyyaml>=6.0"]
remote = ["httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyllm"]