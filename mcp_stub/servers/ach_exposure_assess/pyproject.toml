[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ach-exposure-assess-mcp"
version = "0.1.0"
description = "Deterministic (dumb) MCP server exposing the ACH-exposure ASSESS-segment capability tools (+ notify_pega) for the Amendia cohort worked example (ADR-063)."
requires-python = ">=3.11"
dependencies = [
    # Same pin as the wire stub: mcp 1.29/2.0 restructured the low-level `Server` API this stub uses.
    "mcp>=1.9,<1.29",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.20",
    "anyio>=4",
    "httpx>=0.27",
]

[project.scripts]
ach-exposure-assess-mcp = "ach_exposure_assess_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ach_exposure_assess_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
