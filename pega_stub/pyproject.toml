[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pega-stub"
version = "0.1.0"
description = "Mock Pega orchestrator for the Amendia ADR-063 cohort worked example (ACH exposure). Test/dev scaffolding."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
pega-stub = "pega_stub.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pega_stub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
